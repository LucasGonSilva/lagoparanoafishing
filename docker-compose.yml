name: lpf

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lpf
      MYSQL_USER: lpf
      MYSQL_PASSWORD: lpf_secret
      MYSQL_ROOT_PASSWORD: root_secret
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./docker/php
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: lpf
      DB_USERNAME: lpf
      DB_PASSWORD: lpf_secret
      APP_URL: http://localhost:8090
      APP_TIMEZONE: America/Sao_Paulo
      APP_LOCALE: pt_BR
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./backend/storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
